<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <style>
    :root {
      --bg: #f4f7fb; --card: #ffffff; --border: #e3e8ef; --text: #0f172a; --muted: #64748b;
      --primary: #0f9d76; --primary-hover: #0c8465; --primary-soft: #e7f6f1; --danger: #dc2626;
      --ring: rgba(15,157,118,.25);
    }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #0b1220; --card: #131c2b; --border: #263248; --text: #e6edf6; --muted: #93a1b5;
        --primary: #16b487; --primary-hover: #12a079; --primary-soft: #123027; --danger: #f87171; --ring: rgba(22,180,135,.3); }
    }
    * { box-sizing: border-box; }
    body { width: 384px; margin: 0; font-family: -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); font-size: 14px; }

    /* Header com faixa e logo */
    .topbar { background: linear-gradient(120deg, #0f9d76, #0bbf8e); padding: 14px 16px; display: flex; align-items: center; gap: 11px; color: #fff; }
    .logo { flex: none; }
    .brand b { font-size: 16px; font-weight: 800; letter-spacing: .04em; display: block; line-height: 1.1; }
    .brand small { font-size: 11px; opacity: .92; }
    .sdr { margin-left: auto; text-align: right; font-size: 10.5px; opacity: .95; line-height: 1.25; }

    .body { padding: 14px 16px 16px; }
    .row { display: flex; gap: 8px; align-items: center; margin-bottom: 11px; }
    input { flex: 1; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--border); background: var(--card); color: var(--text); font-size: 12.5px; }
    input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px var(--ring); }
    button { padding: 9px 13px; border-radius: 9px; border: none; background: var(--primary); color: #fff; font-weight: 700; cursor: pointer; font-size: 14px; }
    button:hover { background: var(--primary-hover); }
    button.ghost { background: transparent; color: var(--muted); border: 1px solid var(--border); font-weight: 600; }
    button:disabled { opacity: .55; cursor: not-allowed; }
    #gerar { width: 100%; box-shadow: 0 6px 16px var(--ring); }
    .hint { font-size: 11px; color: var(--muted); margin-top: 7px; }

    .status { min-height: 18px; margin: 11px 0; color: var(--muted); font-size: 12.5px; display: flex; align-items: center; gap: 8px; }
    .status.erro { color: var(--danger); }
    .spinner { width: 14px; height: 14px; border: 2px solid rgba(120,130,140,.3); border-top-color: var(--primary); border-radius: 50%; animation: spin .8s linear infinite; flex: none; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .contadores { display: flex; gap: 8px; margin: 4px 0 2px; }
    .kpi { flex: 1; background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 8px 6px; text-align: center; }
    .kpi b { display: block; font-size: 17px; color: var(--primary); }
    .kpi span { font-size: 10px; color: var(--muted); }

    .hidden { display: none; }
    #dl { display: block; margin: 12px 0; }
    #dl button { width: 100%; }
    .report { max-height: 300px; overflow: auto; background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 12px; margin-top: 4px; }
    .report h2 { font-size: 12.5px; margin: 12px 0 4px; }
    .report table { border-collapse: collapse; width: 100%; margin-bottom: 10px; }
    .report td { border: 1px solid var(--border); padding: 5px 8px; font-size: 11.5px; }
    .report td.rot { font-weight: 700; width: 34%; background: var(--bg); }
    .report ul, .report ol { margin: 3px 0 6px; padding-left: 18px; }
    .report li { margin: 2px 0; font-size: 11.5px; }
    .frase { font-style: italic; color: var(--primary); border-left: 3px solid var(--primary); padding-left: 9px; font-size: 11.5px; }
    code { background: var(--bg); padding: 1px 4px; border-radius: 4px; font-size: 11px; }
  </style>
</head>
<body>
  <div class="topbar">
    <span class="logo">
      <svg width="30" height="30" viewBox="0 0 30 30" fill="none">
        <path d="M4 22 L11 9 L16 17 L26 3" stroke="#ffffff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="26" cy="3.5" r="2.4" fill="#ffffff"/>
      </svg>
    </span>
    <div class="brand"><b>PRONIX</b><small>Closer Report</small></div>
    <div class="sdr">SDR<br /><b>Cauã Lima</b></div>
  </div>

  <div class="body">
    <div class="row">
      <input id="server" type="text" placeholder="http://localhost:3000" />
      <button id="testar" class="ghost" title="Testar conexão com o servidor">Testar</button>
    </div>

    <button id="gerar">Gerar Report da conversa aberta</button>
    <div class="hint">Deixe o servidor (<code>npm start</code>) rodando e uma conversa aberta no WhatsApp Web.</div>

    <div id="status" class="status"></div>

    <div class="contadores">
      <div class="kpi"><b id="cIni">0</b><span>iniciados</span></div>
      <div class="kpi"><b id="cResp">0</b><span>respostas</span></div>
      <div class="kpi"><b id="cRec">0</b><span>recontatos</span></div>
    </div>

    <a id="dl" class="hidden" target="_blank"><button>⬇ Baixar PDF</button></a>
    <div id="report" class="report hidden"></div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
