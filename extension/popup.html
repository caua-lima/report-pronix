<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <style>
    :root {
      --bg: #0f1720; --card: #16212e; --border: #26333f;
      --accent: #25d366; --accent-2: #128c7e; --text: #e6edf3;
      --muted: #8b98a5; --erro: #ff6b6b;
    }
    * { box-sizing: border-box; }
    body {
      width: 380px; margin: 0; padding: 14px;
      font-family: -apple-system, Segoe UI, Roboto, sans-serif;
      background: var(--bg); color: var(--text); font-size: 14px;
    }
    h1 { font-size: 15px; margin: 0 0 10px; display: flex; gap: 8px; align-items: center; }
    .row { display: flex; gap: 8px; align-items: center; margin-bottom: 10px; }
    input {
      flex: 1; padding: 7px 9px; border-radius: 7px;
      border: 1px solid var(--border); background: #0c141c; color: var(--text); font-size: 13px;
    }
    button {
      padding: 9px 12px; border-radius: 8px; border: 1px solid var(--accent);
      background: var(--accent); color: #05130c; font-weight: 700; cursor: pointer; font-size: 14px;
    }
    button.ghost { background: transparent; color: var(--muted); border-color: var(--border); font-weight: 500; }
    button:disabled { opacity: .5; cursor: not-allowed; }
    #gerar { width: 100%; }
    .status { min-height: 18px; margin: 10px 0; color: var(--muted); font-size: 13px; display: flex; align-items: center; gap: 8px; }
    .status.erro { color: var(--erro); }
    .spinner {
      width: 14px; height: 14px; border: 2px solid rgba(255,255,255,.25);
      border-top-color: #fff; border-radius: 50%; animation: spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .hidden { display: none; }
    #dl { display: block; margin: 10px 0; text-align: center; }
    #dl button { width: 100%; }
    .report { max-height: 320px; overflow: auto; background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 12px; }
    .report h2 { font-size: 13px; margin: 12px 0 4px; }
    .report table { border-collapse: collapse; width: 100%; margin-bottom: 10px; }
    .report td { border: 1px solid var(--border); padding: 5px 8px; font-size: 12px; }
    .report td.rot { font-weight: 700; width: 34%; background: #101a24; }
    .report ul, .report ol { margin: 3px 0 6px; padding-left: 18px; }
    .report li { margin: 2px 0; font-size: 12px; }
    .frase { font-style: italic; color: #d6f5e3; border-left: 3px solid var(--accent); padding-left: 9px; font-size: 12px; }
    .hint { font-size: 11px; color: var(--muted); margin-top: 4px; }
  </style>
</head>
<body>
  <h1>📋 Closer Report</h1>

  <div class="row">
    <input id="server" type="text" placeholder="http://localhost:3000" />
    <button id="testar" class="ghost" title="Testar conexão com o servidor">Testar</button>
  </div>

  <button id="gerar">Gerar Report da conversa aberta</button>
  <div class="hint">Deixe o servidor (<code>npm start</code>) rodando e uma conversa aberta no WhatsApp Web.</div>

  <div id="status" class="status"></div>

  <div id="contadores" style="margin-top:10px;padding:9px 11px;border:1px solid var(--border);border-radius:8px;font-size:12px;color:var(--muted)">
    <b style="color:var(--text)">Hoje</b> · iniciados <b id="cIni" style="color:var(--text)">0</b>
    · respostas <b id="cResp" style="color:var(--text)">0</b>
    · recontatos <b id="cRec" style="color:var(--text)">0</b>
  </div>

  <a id="dl" class="hidden" target="_blank"><button>⬇ Baixar PDF</button></a>
  <div id="report" class="report hidden"></div>

  <script src="popup.js"></script>
</body>
</html>
