<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WhatsApp Closer Report</title>
  <style>
    :root {
      --bg: #0f1720;
      --card: #16212e;
      --border: #26333f;
      --accent: #25d366;
      --accent-2: #128c7e;
      --text: #e6edf3;
      --muted: #8b98a5;
      --eu: #075e54;
      --eles: #202c33;
      --erro: #ff6b6b;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }
    header {
      padding: 20px 24px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 12px;
    }
    header h1 { font-size: 1.2rem; margin: 0; }
    .wrap { max-width: 900px; margin: 0 auto; padding: 24px; }
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      margin-bottom: 20px;
    }
    select, button {
      font-size: 0.95rem;
      padding: 10px 14px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text);
      cursor: pointer;
    }
    select { min-width: 220px; }
    button.primary { background: var(--accent-2); border-color: var(--accent-2); font-weight: 600; }
    button.accent { background: var(--accent); border-color: var(--accent); color: #05130c; font-weight: 700; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .badge { font-size: 0.75rem; color: var(--muted); }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 18px;
      margin-bottom: 20px;
    }
    .hidden { display: none; }
    .erro {
      background: #3a1c1c;
      border: 1px solid var(--erro);
      color: #ffd7d7;
      padding: 12px 14px;
      border-radius: 8px;
      margin-bottom: 16px;
    }
    /* Conversa */
    .msg { max-width: 80%; margin: 8px 0; padding: 8px 12px; border-radius: 10px; }
    .msg .meta { font-size: 0.72rem; color: var(--muted); margin-bottom: 2px; }
    .msg.eu { background: var(--eu); margin-left: auto; }
    .msg.eles { background: var(--eles); margin-right: auto; }
    .msg .icon { margin-right: 4px; }
    /* Spinner */
    .spinner {
      display: inline-block; width: 18px; height: 18px;
      border: 3px solid rgba(255,255,255,0.25); border-top-color: #fff;
      border-radius: 50%; animation: spin 0.8s linear infinite; vertical-align: middle;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading { display: flex; align-items: center; gap: 10px; color: var(--muted); }
    /* Report preview */
    .report h2 { font-size: 1.05rem; margin: 18px 0 6px; }
    .report table { border-collapse: collapse; width: 100%; margin: 8px 0 18px; }
    .report td { border: 1px solid var(--border); padding: 8px 12px; }
    .report td.rot { font-weight: 700; width: 30%; background: #101a24; }
    .report ul, .report ol { margin: 4px 0 8px; padding-left: 22px; }
    .report li { margin: 3px 0; }
    .frase { font-style: italic; color: #d6f5e3; border-left: 3px solid var(--accent); padding-left: 12px; }
    .row-gap { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  </style>
</head>
<body>
  <header>
    <span style="font-size:1.5rem">📋</span>
    <h1>WhatsApp Closer Report</h1>
  </header>

  <div class="wrap">
    <div class="controls">
      <select id="contatos"><option value="">Carregando contatos…</option></select>
      <button id="btnLer" class="primary">Ler conversa</button>
      <button id="btnReport" class="accent">Gerar Report</button>
      <span id="statusContato" class="badge"></span>
    </div>

    <div id="erro" class="erro hidden"></div>
    <div id="loading" class="loading hidden">
      <span class="spinner"></span><span id="loadingTxt">Processando…</span>
    </div>

    <div id="conversaCard" class="card hidden">
      <h3 style="margin-top:0">Conversa</h3>
      <div id="conversa"></div>
    </div>

    <div id="reportCard" class="card hidden">
      <div class="row-gap" style="justify-content:space-between">
        <h3 style="margin:0">Prévia do relatório</h3>
        <a id="download" href="#"><button class="accent">⬇ Baixar .docx</button></a>
      </div>
      <div id="report" class="report"></div>
    </div>
  </div>

  <script>
    const $ = (id) => document.getElementById(id);
    const contatosSel = $('contatos');

    function mostrarErro(msg) {
      const e = $('erro');
      e.textContent = '⚠ ' + msg;
      e.classList.remove('hidden');
    }
    function limparErro() { $('erro').classList.add('hidden'); }
    function setLoading(on, txt) {
      const l = $('loading');
      if (on) { $('loadingTxt').textContent = txt || 'Processando…'; l.classList.remove('hidden'); }
      else l.classList.add('hidden');
    }

    async function carregarContatos() {
      try {
        const r = await fetch('/api/contatos');
        const lista = await r.json();
        if (!Array.isArray(lista) || lista.length === 0) {
          contatosSel.innerHTML = '<option value="">Nenhum contato monitorado</option>';
          return;
        }
        contatosSel.innerHTML = lista.map((c) =>
          `<option value="${c.jid}" data-hist="${c.temHistorico}">${c.numero}${c.temHistorico ? '' : ' (sem histórico)'}</option>`
        ).join('');
        atualizarStatus();
      } catch (err) {
        contatosSel.innerHTML = '<option value="">Erro ao carregar</option>';
        mostrarErro('Não foi possível carregar os contatos: ' + err.message);
      }
    }

    function atualizarStatus() {
      const opt = contatosSel.selectedOptions[0];
      $('statusContato').textContent = opt && opt.dataset.hist === 'false'
        ? 'Este contato ainda não tem conversa salva.' : '';
    }
    contatosSel.addEventListener('change', atualizarStatus);

    function iconePara(m) {
      return m.type === 'audio' ? '🎤' : '💬';
    }
    function horaDe(ts) {
      if (!ts) return '';
      const d = new Date(ts);
      return isNaN(d) ? '' : d.toLocaleString('pt-BR');
    }

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, (c) =>
        ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }

    async function lerConversa() {
      limparErro();
      $('reportCard').classList.add('hidden');
      const jid = contatosSel.value;
      if (!jid) { mostrarErro('Selecione um contato.'); return; }
      setLoading(true, 'Carregando conversa…');
      try {
        const r = await fetch('/api/conversa/' + encodeURIComponent(jid));
        const data = await r.json();
        if (!r.ok) throw new Error(data.erro || 'Erro ao carregar conversa.');
        if (!Array.isArray(data) || data.length === 0) {
          mostrarErro('Esse contato ainda não tem conversa salva.');
          $('conversaCard').classList.add('hidden');
          return;
        }
        $('conversa').innerHTML = data.map((m) => {
          const lado = m.from === 'eu' ? 'eu' : 'eles';
          const quem = m.from === 'eu' ? 'Eu' : 'Lead';
          return `<div class="msg ${lado}">
            <div class="meta">${quem} · ${horaDe(m.timestamp)}</div>
            <div><span class="icon">${iconePara(m)}</span>${escapeHtml(m.content)}</div>
          </div>`;
        }).join('');
        $('conversaCard').classList.remove('hidden');
      } catch (err) {
        mostrarErro(err.message);
      } finally {
        setLoading(false);
      }
    }

    function lista(arr, ordenada) {
      const tag = ordenada ? 'ol' : 'ul';
      const itens = (arr || []).map((i) => `<li>${escapeHtml(i)}</li>`).join('');
      return `<${tag}>${itens}</${tag}>`;
    }

    function renderReport(d) {
      return `
        <table>
          <tr><td class="rot">Lead</td><td>${escapeHtml(d.lead)}</td></tr>
          <tr><td class="rot">Status</td><td>${escapeHtml(d.status)}</td></tr>
          <tr><td class="rot">Nicho</td><td>${escapeHtml(d.nicho)}</td></tr>
          <tr><td class="rot">Investimento</td><td>${escapeHtml(d.investimento)}</td></tr>
        </table>
        <h2>👤 Perfil & Contexto</h2>${lista(d.perfil_contexto)}
        <h2>📍 Momento Atual</h2>${lista(d.momento_atual)}
        <h2>📈 Sinais de Tração</h2>${lista(d.sinais_tracao)}
        <h2>💰 Capacidade & Decisão</h2>${lista(d.capacidade_decisao)}
        <h2>📅 Agendamento & Status</h2>${lista(d.agendamento_status)}
        <h2>🎯 Leitura Estratégica</h2>${lista(d.leitura_estrategica)}
        <h2>✅ O que o closer deve bater</h2>${lista(d.closer_deve_bater, true)}
        <h2>💬 Frase de Impacto</h2>
        <p class="frase">"${escapeHtml(d.frase_impacto)}"</p>
      `;
    }

    async function gerarReport() {
      limparErro();
      const jid = contatosSel.value;
      if (!jid) { mostrarErro('Selecione um contato.'); return; }
      setLoading(true, 'Lendo conversa e gerando report…');
      $('btnReport').disabled = true;
      try {
        const r = await fetch('/api/report/' + encodeURIComponent(jid), { method: 'POST' });
        const data = await r.json();
        if (!r.ok) throw new Error(data.erro || 'Erro ao gerar relatório.');
        $('report').innerHTML = renderReport(data.dados);
        $('download').href = '/api/download/' + encodeURIComponent(data.arquivo);
        $('reportCard').classList.remove('hidden');
      } catch (err) {
        mostrarErro(err.message);
      } finally {
        setLoading(false);
        $('btnReport').disabled = false;
      }
    }

    $('btnLer').addEventListener('click', lerConversa);
    $('btnReport').addEventListener('click', gerarReport);
    carregarContatos();
  </script>
</body>
</html>
