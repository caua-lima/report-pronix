<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Report do Dia — Report PRONIX</title>
  <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16.png" />
  <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="48x48" href="/icons/favicon-48.png" />
  <link rel="apple-touch-icon" href="/icons/icon128.png" />
  <script>
    // Mesmo tema escolhido no painel (auto, claro ou escuro).
    try { var t = localStorage.getItem('crTema'); if (t === 'claro' || t === 'escuro') document.documentElement.dataset.tema = t; } catch (_) { /* segue o sistema */ }
  </script>
  <style>
    /* tokens:inicio
     * Sistema visual do Report PRONIX: papel, tinta e marca-texto.
     * O papel e a tinta carregam a estrutura; o âmbar é o marca-texto — só destaca o que está ativo
     * ou o número que importa. Este bloco é IDÊNTICO no painel, no Report do Dia, na política de
     * privacidade e no popup da extensão (tests/design.test.js confere): mudou aqui, mude nos quatro.
     */
    :root {
      color-scheme: light dark;
      --f-titulo: Bahnschrift, "DIN Alternate", "Roboto Condensed", "Arial Narrow", system-ui, sans-serif;
      --f-texto: "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif;
      --f-mono: "Cascadia Mono", ui-monospace, "SF Mono", Consolas, monospace;
      --ouro: #ffb800; --ouro-claro: #ffcc45; --ouro-tinta: #8a5d00; --marca: rgba(255,184,0,.45);
      --preto: #18171b;
      --bg: #f3efe6; --lateral: #eae5d8; --card: #fffdf7; --card-2: #f7f2e7; --campo: #ffffff;
      --border: #e2dbc9; --border-forte: #c9c0a9;
      --text: #18171b; --text-2: #4d4a45; --muted: #6f6a60;
      --danger: #c2331f; --ok: #0f7a43; --info: #2b59c3; --roxo: #6247c9;
      --ring: rgba(255,184,0,.5);
      --shadow: none; --shadow-2: 0 14px 34px -14px rgba(24,23,27,.28);
      --r: 10px; --r-sm: 7px;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-tema="claro"]) {
        --ouro: #ffc233; --ouro-claro: #ffd466; --ouro-tinta: #ffc233; --marca: rgba(255,194,51,.28);
        --preto: #0d0c0e;
        --bg: #121113; --lateral: #0d0c0e; --card: #1a191c; --card-2: #222125; --campo: #141316;
        --border: #2f2d32; --border-forte: #47444c;
        --text: #f3efe6; --text-2: #bcb7ab; --muted: #8f8a7f;
        --danger: #ff6f5c; --ok: #3ddc84; --info: #8aa9ff; --roxo: #b79cff;
        --ring: rgba(255,194,51,.45);
        --shadow-2: 0 16px 40px -12px rgba(0,0,0,.75);
      }
    }
    :root[data-tema="claro"] { color-scheme: light; }
    :root[data-tema="escuro"] {
      color-scheme: dark;
      --ouro: #ffc233; --ouro-claro: #ffd466; --ouro-tinta: #ffc233; --marca: rgba(255,194,51,.28);
      --preto: #0d0c0e;
      --bg: #121113; --lateral: #0d0c0e; --card: #1a191c; --card-2: #222125; --campo: #141316;
      --border: #2f2d32; --border-forte: #47444c;
      --text: #f3efe6; --text-2: #bcb7ab; --muted: #8f8a7f;
      --danger: #ff6f5c; --ok: #3ddc84; --info: #8aa9ff; --roxo: #b79cff;
      --ring: rgba(255,194,51,.45);
      --shadow-2: 0 16px 40px -12px rgba(0,0,0,.75);
    }
    /* O marca-texto: um risco de âmbar atrás do texto, como num relatório sublinhado à mão. */
    .marca {
      background: linear-gradient(transparent 54%, var(--marca) 54%, var(--marca) 93%, transparent 93%);
      padding: 0 .16em; margin: 0 -.16em; border-radius: 2px;
      -webkit-box-decoration-break: clone; box-decoration-break: clone;
    }
    /* tokens:fim */

    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body { font-family: var(--f-texto); background: var(--bg); color: var(--text); line-height: 1.55; -webkit-font-smoothing: antialiased; }
    ::selection { background: var(--ouro); color: #18171b; }
    :focus-visible { outline: 2px solid var(--ouro-tinta); outline-offset: 2px; }
    a { color: var(--ouro-tinta); }
    header { position: sticky; top: 0; z-index: 10; background: var(--lateral); border-bottom: 1px solid var(--border); }
    .header-in { max-width: 820px; margin: 0 auto; padding: 14px 24px; display: flex; align-items: center; gap: 11px; }
    .header-in > svg { flex: none; }
    .brand b { font-family: var(--f-titulo); font-size: 1.14rem; letter-spacing: .01em; display: block; line-height: 1.05; font-weight: 700; }
    .brand small { font-family: var(--f-titulo); font-size: .66rem; color: var(--muted); letter-spacing: .16em; text-transform: uppercase; }
    .voltar { margin-left: auto; font-size: .82rem; font-weight: 600; text-decoration: none; color: var(--text-2); border: 1px solid var(--border-forte); border-radius: var(--r-sm); padding: 6px 11px; }
    .voltar:hover { color: var(--text); border-color: var(--text); }
    .wrap { max-width: 820px; margin: 0 auto; padding: 26px 24px 60px; }
    .pagina-topo { margin: 0 0 20px; }
    .pagina-topo h1 { font-family: var(--f-titulo); font-size: 1.95rem; line-height: 1.1; font-weight: 700; margin: 0; }
    .pagina-topo p { margin: 7px 0 0; color: var(--text-2); font-size: .93rem; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: var(--r); padding: 20px; margin-bottom: 14px; }
    .t { font-family: var(--f-titulo); font-weight: 700; font-size: 1.1rem; margin-bottom: 12px; }
    label { display: block; font-size: .78rem; font-weight: 600; color: var(--text-2); margin-bottom: 6px; }
    input, select, textarea { width: 100%; padding: 10px 12px; border-radius: var(--r-sm); border: 1px solid var(--border-forte); background: var(--campo); color: var(--text); font-size: .95rem; font-family: inherit; transition: border-color .15s, box-shadow .15s; }
    input:hover, select:hover, textarea:hover { border-color: var(--muted); }
    input:focus, select:focus, textarea:focus { outline: none; border-color: var(--text); box-shadow: 0 0 0 3px var(--ring); }
    input[type="number"] { font-family: var(--f-titulo); font-size: 1.3rem; font-weight: 700; font-variant-numeric: tabular-nums; }
    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .grid-nums { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
    .btn { border: 1px solid var(--text); border-radius: var(--r-sm); padding: 11px 18px; font-size: .94rem; font-weight: 650; cursor: pointer; font-family: inherit; background: var(--text); color: var(--bg); transition: background .15s, box-shadow .15s, transform .06s, border-color .15s; }
    .btn:hover { box-shadow: inset 0 -3px 0 var(--ouro); } .btn:active { transform: translateY(1px); }
    .btn.sec { background: transparent; color: var(--text); border-color: var(--border-forte); }
    .btn.sec:hover { border-color: var(--text); box-shadow: inset 0 -3px 0 var(--marca); }
    .btn.principal { background: var(--ouro); color: #18171b; border-color: var(--ouro); font-family: var(--f-titulo); font-size: 1.1rem; letter-spacing: .02em; padding: 14px 18px; }
    .btn.principal:hover { background: var(--ouro-claro); border-color: var(--ouro-claro); box-shadow: inset 0 -3px 0 #18171b; }
    .btn.block { width: 100%; }
    .row { display: flex; gap: 8px; align-items: stretch; flex-wrap: wrap; }
    .row .grow { flex: 1; min-width: 180px; }
    /* Categoria do registro: três cores do sistema, sempre as mesmas no seletor e na etiqueta. */
    .seg-cat { display: inline-flex; border: 1px solid var(--border-forte); border-radius: var(--r-sm); overflow: hidden; flex: none; }
    .seg-cat button { border: none; background: transparent; color: var(--text-2); font-weight: 600; padding: 9px 12px; cursor: pointer; font-size: .82rem; font-family: inherit; }
    .seg-cat button + button { border-left: 1px solid var(--border-forte); }
    .seg-cat button[data-c="agenda"].on, .chip.agenda { background: var(--ouro); color: #18171b; }
    .seg-cat button[data-c="noshow"].on, .chip.noshow { background: var(--roxo); color: var(--card); }
    .seg-cat button[data-c="desq"].on, .chip.desq { background: var(--danger); color: var(--card); }
    .entries { margin-top: 14px; display: flex; flex-direction: column; gap: 7px; }
    .entry { display: flex; align-items: center; gap: 10px; padding: 8px 11px; border: 1px solid var(--border); border-radius: var(--r-sm); background: var(--card-2); font-size: .9rem; }
    .chip { flex: none; font-family: var(--f-titulo); font-size: .68rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; padding: 3px 8px; border-radius: 4px; }
    .entry .tx { flex: 1; } .entry .x { flex: none; cursor: pointer; color: var(--muted); } .entry .x:hover { color: var(--danger); }
    .empty { color: var(--muted); font-size: .87rem; text-align: center; padding: 14px; }
    pre { white-space: pre-wrap; word-break: break-word; background: var(--card-2); border: 1px solid var(--border); border-radius: var(--r-sm); padding: 16px; font-family: var(--f-mono); font-size: .86rem; line-height: 1.5; margin: 0; }
    .result-head { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; margin-bottom: 10px; }
    .muted { color: var(--muted); font-size: .82rem; }
    .hidden { display: none; }
    .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--text); color: var(--bg); padding: 10px 18px; border-radius: var(--r-sm); font-weight: 600; box-shadow: var(--shadow-2), inset 0 -3px 0 var(--ouro); opacity: 0; transition: opacity .2s; pointer-events: none; }
    .toast.show { opacity: 1; }
    @media (max-width: 560px) { .grid2 { grid-template-columns: 1fr; } .wrap { padding: 20px 16px 48px; } .header-in { padding: 12px 16px; } }
  </style>
</head>
<body>
  <header>
    <div class="header-in">
      <svg class="logo-rp" width="30" height="30" viewBox="0 0 128 128" aria-hidden="true"><rect width="128" height="128" rx="28" fill="#ffb800"/><path d="M34 22h38l20 20v64H34z" fill="#18171b"/><path d="M72 22l20 20H72z" fill="#45424b"/><path d="M46 56h34M46 72h28M46 88h16" fill="none" stroke="#ffb800" stroke-width="7" stroke-linecap="round"/><circle cx="92" cy="96" r="26" fill="#ffb800"/><circle cx="92" cy="96" r="21" fill="#1fbf5c"/><path d="M81 97l8 8 14-17" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <div class="brand"><b>Report <span class="marca">PRONIX</span></b><small>Report do dia</small></div>
      <a class="voltar" href="/">Voltar ao painel</a>
    </div>
  </header>

  <div class="wrap">
    <div class="pagina-topo">
      <h1><span class="marca">Report do dia</span></h1>
      <p>Registre ao longo do dia e gere o resumo no fim.</p>
    </div>
    <!-- Cabeçalho -->
    <div class="card">
      <div class="grid2">
        <div><label for="nome">Seu nome</label><input id="nome" type="text" placeholder="Ex.: Cauã Lima" /></div>
        <div><label for="data">Data</label><input id="data" type="date" /></div>
      </div>
    </div>

    <!-- Números do dia -->
    <div class="card">
      <div class="t">Números do dia</div>
      <div class="grid-nums">
        <div><label>Automáticas</label><input id="automaticas" type="number" min="0" value="0" /></div>
        <div><label>Leads novos contatados</label><input id="leadsNovos" type="number" min="0" value="0" /></div>
        <div><label>Respostas</label><input id="respostas" type="number" min="0" value="0" /></div>
        <div><label>Recontatos</label><input id="recontatos" type="number" min="0" value="0" /></div>
        <div><label>Ligações</label><input id="ligacoes" type="number" min="0" value="0" /></div>
      </div>
      <div class="muted" style="margin-top:8px" id="autoNota">Preencha os números do dia à mão.</div>
    </div>

    <!-- Registros (chatzinho) -->
    <div class="card">
      <div class="t">Registros do dia</div>
      <div class="row">
        <div class="seg-cat" id="seg">
          <button data-c="agenda" class="on">Agenda caiu</button>
          <button data-c="noshow">No show</button>
          <button data-c="desq">Desqualificado</button>
        </div>
        <input id="entrada" class="grow" type="text" placeholder="Ex.: Luis às 14h sem respostas" />
        <button id="add" class="btn">Adicionar</button>
      </div>
      <div class="muted" style="margin-top:8px" id="dicaCat">Vai para <b>Agendas que caíram</b>. Enter também adiciona.</div>
      <div id="entries" class="entries"><div class="empty" id="empty">Nenhum registro ainda. Vá adicionando ao longo do dia.</div></div>
    </div>

    <div class="row" style="gap:10px">
      <button id="gerar" class="btn principal" style="flex:1">Gerar report do dia</button>
      <button id="limpar" class="btn sec">Limpar dia</button>
    </div>

    <!-- Resultado -->
    <div id="resultado" class="card hidden" style="margin-top:18px">
      <div class="result-head">
        <div class="t" style="margin:0">Report pronto</div>
        <div class="row" style="gap:8px">
          <button id="copiar" class="btn">Copiar</button>
          <button id="baixar" class="btn sec">Baixar .txt</button>
        </div>
      </div>
      <pre id="saida"></pre>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <script>
    const $ = (id) => document.getElementById(id);
    const getChave = () => ($('chave') && $('chave').value || '').trim();
    const KEY = 'reportDia_v1';
    let cat = 'agenda';
    let entries = []; // { cat, texto }

    const rotuloCat = { agenda: 'Agendas que caíram', noshow: 'NO SHOW', desq: 'Desqualificados' };

    function salvar() {
      localStorage.setItem(KEY, JSON.stringify({
        nome: $('nome').value, data: $('data').value, chave: getChave(),
        nums: ['automaticas', 'leadsNovos', 'respostas', 'recontatos', 'ligacoes'].reduce((o, k) => (o[k] = $(k).value, o), {}),
        entries,
      }));
    }
    function carregar() {
      const hoje = new Date().toISOString().slice(0, 10);
      let s = {};
      try { s = JSON.parse(localStorage.getItem(KEY)) || {}; } catch (_) {}
      $('nome').value = s.nome || 'Cauã Lima';
      if ($('chave')) $('chave').value = s.chave || '';
      $('data').value = s.data || hoje;
      const nums = s.nums || {};
      ['automaticas', 'leadsNovos', 'respostas', 'recontatos', 'ligacoes'].forEach((k) => { $(k).value = nums[k] != null ? nums[k] : 0; });
      entries = Array.isArray(s.entries) ? s.entries : [];
      render();
    }

    function render() {
      const box = $('entries');
      box.querySelectorAll('.entry').forEach((n) => n.remove());
      $('empty').style.display = entries.length ? 'none' : '';
      entries.forEach((e, i) => {
        const div = document.createElement('div');
        div.className = 'entry';
        const nome = { agenda: 'AGENDA', noshow: 'NO SHOW', desq: 'DESQ' }[e.cat];
        div.innerHTML = `<span class="chip ${e.cat}">${nome}</span><span class="tx"></span><span class="x" data-i="${i}" title="Remover">✕</span>`;
        div.querySelector('.tx').textContent = e.texto;
        box.appendChild(div);
      });
    }

    $('entries').addEventListener('click', (ev) => {
      const x = ev.target.closest('.x');
      if (x) { entries.splice(+x.dataset.i, 1); render(); salvar(); }
    });

    $('seg').addEventListener('click', (ev) => {
      const b = ev.target.closest('button'); if (!b) return;
      cat = b.dataset.c;
      [...$('seg').children].forEach((c) => c.classList.toggle('on', c === b));
      $('dicaCat').innerHTML = `Vai para <b>${rotuloCat[cat]}</b>. Enter também adiciona.`;
      $('entrada').placeholder = cat === 'desq' ? 'Ex.: Desqualificação financeira' : 'Ex.: Luis às 14h sem respostas';
    });

    function adicionar() {
      const texto = $('entrada').value.trim();
      if (!texto) return;
      entries.push({ cat, texto });
      $('entrada').value = '';
      render(); salvar();
    }
    $('add').addEventListener('click', adicionar);
    $('entrada').addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); adicionar(); } });

    ['nome', 'data', 'chave', 'automaticas', 'leadsNovos', 'respostas', 'recontatos', 'ligacoes'].forEach((k) =>
      $(k).addEventListener('input', salvar)
    );

    function fmtData(iso) {
      if (!iso) return '';
      const [y, m, d] = iso.split('-');
      return `${d}/${m}`;
    }

    function montarReport() {
      const nome = $('nome').value.trim() || 'SDR';
      const linhas = [];
      linhas.push(`REPORT ${nome} | ${fmtData($('data').value)}`);
      linhas.push('');
      linhas.push(`Automáticas: ${$('automaticas').value || 0}`);
      linhas.push(`Leads novos contatados: ${$('leadsNovos').value || 0}`);
      linhas.push(`Respostas: ${$('respostas').value || 0}`);
      linhas.push(`Recontatos: ${$('recontatos').value || 0}`);
      linhas.push(`Ligações: ${$('ligacoes').value || 0}`);
      linhas.push('');

      const agenda = entries.filter((e) => e.cat === 'agenda').map((e) => e.texto);
      const noshow = entries.filter((e) => e.cat === 'noshow').map((e) => e.texto);
      const desq = entries.filter((e) => e.cat === 'desq').map((e) => e.texto);

      linhas.push('Agendas que caíram:');
      agenda.forEach((t) => linhas.push(t.endsWith('.') ? t : t + '.'));
      linhas.push('');

      linhas.push('NO SHOW:');
      noshow.forEach((t) => linhas.push(t.endsWith('.') ? t : t + '.'));
      linhas.push('');

      // Desqualificados: agrupa motivos iguais -> "Nx motivo"
      const cont = new Map();
      desq.forEach((t) => {
        const chave = t.replace(/\.$/, '').trim();
        const k = chave.toLowerCase();
        cont.set(k, { n: (cont.get(k)?.n || 0) + 1, texto: cont.get(k)?.texto || chave });
      });
      linhas.push('Desqualificados:');
      [...cont.values()].forEach((v) => linhas.push(`${v.n}x ${v.texto}.`));

      return linhas.join('\n');
    }

    function toast(msg) {
      const t = $('toast'); t.textContent = msg; t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 1600);
    }

    $('gerar').addEventListener('click', () => {
      $('saida').textContent = montarReport();
      $('resultado').classList.remove('hidden');
      $('resultado').scrollIntoView({ behavior: 'smooth', block: 'start' });
    });
    $('copiar').addEventListener('click', async () => {
      try { await navigator.clipboard.writeText($('saida').textContent); toast('Copiado!'); }
      catch (_) { toast('Não consegui copiar — selecione e copie manual.'); }
    });
    $('baixar').addEventListener('click', () => {
      const blob = new Blob([$('saida').textContent], { type: 'text/plain;charset=utf-8' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `report_${($('nome').value.trim() || 'dia').replace(/\s+/g, '-')}_${$('data').value}.txt`;
      a.click();
    });
    $('limpar').addEventListener('click', () => {
      if (!confirm('Limpar os registros e zerar os números deste dia? (o nome é mantido)')) return;
      entries = [];
      ['automaticas', 'leadsNovos', 'respostas', 'recontatos', 'ligacoes'].forEach((k) => ($(k).value = 0));
      $('data').value = new Date().toISOString().slice(0, 10);
      $('resultado').classList.add('hidden');
      render(); salvar();
    });


    carregar();
  </script>
</body>
</html>
